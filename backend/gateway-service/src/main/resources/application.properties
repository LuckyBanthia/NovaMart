# Standard Main API Entry Port for NovaMart
server.port=8080

spring.application.name=gateway-service

# Eureka Discovery Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================================================================
# API Gateway Routing Rules
# ============================================================================

# 1. User & Authentication Service (Port 8081)
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# 2. Product Catalog & Inventory Service (Port 8082)
spring.cloud.gateway.routes[1].id=product-service-route
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**,/api/admin/products/**

# 3. Order Processing & Invoicing Service (Port 8083)
spring.cloud.gateway.routes[2].id=order-service-route
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**,/api/admin/orders/**,/api/admin/dashboard/**

# 4. Scikit-Learn AI Microservice (Port 8084)
spring.cloud.gateway.routes[3].id=ai-service-route
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/ai/**

# ============================================================================
# Global CORS Configuration (Allows React Vite Frontend on Port 5173)
# ============================================================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:5173,http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
